name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: CLI smoke test
        run: |
          node build/src/cli.js --version
          node build/src/cli.js tools
          node build/src/cli.js init --all --dry-run --root .
          node build/src/cli.js dump --root .
          node build/src/cli.js sync --root .
          git diff --exit-code -- .ai AGENTS.md CLAUDE.md GEMINI.md .claude .pi .cursor .gemini .windsurf .github/prompts .github/instructions .github/copilot-instructions.md .agents
      - name: Verify the contract block is present exactly once per rule file
        run: |
          for f in AGENTS.md CLAUDE.md GEMINI.md .cursor/rules/engram-memory.mdc \
                   .windsurf/rules/engram-memory.md .github/copilot-instructions.md \
                   .github/instructions/engram-memory.instructions.md; do
            n=$(grep -c 'engram:contract:start v' "$f")
            if [ "$n" -ne 1 ]; then echo "$f has $n contract blocks"; exit 1; fi
          done
      - name: Verify the packed tarball actually installs and runs
        # `npm pack --dry-run` only lists files. A files/bin/outDir mistake produces a broken
        # published artifact while every other step stays green - exactly the class of bug in
        # .ai/pitfalls/cases/tsc-wrong-outdir.md. Only installing the real tarball catches it.
        if: matrix.node == '22'
        run: |
          set -euo pipefail
          tarball=$(npm pack --silent | tail -1)
          work=$(mktemp -d)
          cd "$work"
          npm init -y >/dev/null
          npm i "$OLDPWD/$tarball" --silent
          npx engram --version
          npx engram init --tools claude,pi
          npx engram dump | head -2
          npx engram sync >/dev/null
          test -f CLAUDE.md && test -d .ai/skills
          # idempotency of the published artifact
          before=$(md5sum CLAUDE.md AGENTS.md | md5sum)
          npx engram sync >/dev/null
          after=$(md5sum CLAUDE.md AGENTS.md | md5sum)
          test "$before" = "$after"
      - name: A rule file must gain exactly one contract block after a repair
        run: |
          set -euo pipefail
          f=$(mktemp)
          printf '# Rules\n\nDocumenting `<!-- engram:contract:start -->` inline.\n' > "$f"
          node -e "
            const fs=require('fs');
            const {renderRuleFile}=require('./build/src/adapters/rules.js');
            fs.writeFileSync(process.argv[1], renderRuleFile(
              {path:'AGENTS.md',kind:'agents',note:'ci'},
              {projectName:'ci',alsoReadBy:[]}, fs.readFileSync(process.argv[1],'utf8')).content);
          " "$f"
          test "$(grep -c '^<!-- engram:contract:start v' "$f")" = 1
          grep -q 'Documenting' "$f"
          node -e "
            const fs=require('fs');
            const {refreshContract}=require('./build/src/adapters/rules.js');
            fs.writeFileSync(process.argv[1], refreshContract(fs.readFileSync(process.argv[1],'utf8'),
              {path:'AGENTS.md',kind:'agents',note:'ci'}).content);
          " "$f"
          test "$(grep -c '^<!-- engram:contract:start v' "$f")" = 1